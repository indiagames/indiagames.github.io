<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepak Arcade Hub - Offline HTML5 Games</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --badge-bg: #0369a1;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --surface-hover: #e2e8f0;
            --accent-color: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --badge-bg: #e0f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn:hover {
            border-color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .categories-filter {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            scrollbar-width: thin;
        }

        .category-chip {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .category-chip.active, .category-chip:hover {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .game-badge {
            font-size: 0.75rem;
            background-color: var(--surface-hover);
            color: var(--text-secondary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        .fav-btn.active {
            color: #f43f5e;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
            background-color: var(--surface-color);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">

    <footer>
        <p>&copy; 2026 Deepak IT & Web Services. Hosted on GitHub Pages.</p>

            "tetrisds", "thebindingofisaac", "theimpossiblequiz", "theimpossiblequiz2", "thelegendofzelda", "themehotel", 
            "thereisnogame", "thesims2", "thesims3", "thisistheonlylevel", "thumbfighter", "timeshooter1", "timeshooter2", 
            "timeshooter3", "tinyfishing", "townscaper", "tron", "tubejumpers", "tunnelrush", "turokdinosaurhunter", 
            "twinshot", "twinshot2", "ultimateflashsonic", "unfairmario", "vex", "vex2", "vex3", "vex4", "vex5", "vex6", 
            "vex7", "volleyrandom", "wallsmash", "warioland4", "wariolandii", "warioswoods", "warioware", "wariowarediy", 
            "wariowaretouched", "watermelongame", "waterworks", "waverace64", "wordle", "worldshardestgame", "worldshardestgame2", 
            "wormsworldparty", "wubzzysamazingadventure", "xx142-b2.exe", "yohoho", "yoshisisland", "yoshisstory", "zombocalypse", 
            "zombotron", "zombotron2"
        ];

        let favorites = JSON.parse(localStorage.getItem('arcade_favorites')) || [];
        let currentCategory = 'all';
        let showOnlyFavs = false;

        function formatGameName(folder) {
            return folder
                .replace(/([A-Z])/g, ' $1')
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
        }

        function getCategory(folder) {
            const f = folder.toLowerCase();
            if (f.includes('mario')) return 'mario';
            if (f.includes('pokemon')) return 'pokemon';
            if (f.includes('zelda')) return 'zelda';
            if (f.includes('sonic')) return 'sonic';
            if (f.includes('papa')) return 'papa';
            if (f.includes('slope') || f.includes('run') || f.includes('drift')) return 'slope';
            if (f.includes('fnaf')) return 'fnaf';
            if (f.includes('tetris') || f.includes('doom') || f.includes('contra') || f.includes('pacman')) return 'retro';
            return 'other';
        }

        const games = rawFolders.map(folder => ({
            folder: folder,
            name: formatGameName(folder),
            category: getCategory(folder)
        }));

        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const gameCounter = document.getElementById('gameCounter');
        const favCountSpan = document.getElementById('favCount');
        const favFilterBtn = document.getElementById('favFilterBtn');

        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            let filtered = games.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(searchTerm) || game.folder.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'all' || game.category === currentCategory;
                const matchesFav = !showOnlyFavs || favorites.includes(game.folder);
                return matchesSearch && matchesCategory && matchesFav;
            });

            gameCounter.textContent = `Showing ${filtered.length} of ${games.length} games`;
            favCountSpan.textContent = favorites.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">No games found matching your criteria.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(game => {
                const isFav = favorites.includes(game.folder);
                return `
                    <a href="./${game.folder}/index.html" class="game-card">
                        <div class="game-info">
                            <h3>${game.name}</h3>
                        </div>
                        <div class="game-meta">
                            <span class="game-badge">${game.category}</span>
                            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${game.folder}')" title="Favorite">
                                ${isFav ? '⭐' : '☆'}
                            </button>
                        </div>
                    </a>
                `;
            }).join('');
        }

        window.toggleFavorite = function(e, folder) {
            e.preventDefault();
            e.stopPropagation();
            if (favorites.includes(folder)) {
                favorites = favorites.filter(f => f !== folder);
            } else {
                favorites.push(folder);
            }
            localStorage.setItem('arcade_favorites', JSON.stringify(favorites));
            renderGames();
        };

        searchInput.addEventListener('input', renderGames);

        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderGames();
            });
        });

        favFilterBtn.addEventListener('click', () => {
            showOnlyFavs = !showOnlyFavs;
            favFilterBtn.style.background = showOnlyFavs ? 'var(--accent-color)' : 'var(--surface-hover)';
            favFilterBtn.style.color = showOnlyFavs ? '#fff' : 'var(--text-primary)';
            renderGames();
        });

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        renderGames();
    </script>
</body>
